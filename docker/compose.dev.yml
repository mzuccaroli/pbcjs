name: pbcjs-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pbc
      POSTGRES_DB: pbc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pbc -d pbc']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata-dev: {}
